<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>108ight — New Password</title>

    <link
        rel="stylesheet"
        href="auth.css"
    >

</head>


<body>


    <main class="auth-page">

        <section class="auth-box">

            <h1 class="auth-title">
                New Password
            </h1>


            <form
                id="reset-password-form"
                class="auth-form"
            >

                <label for="password">
                    New Password
                </label>

                <input
                    id="password"
                    type="password"
                    autocomplete="new-password"
                    required
                >


                <label for="password-confirm">
                    Confirm New Password
                </label>

                <input
                    id="password-confirm"
                    type="password"
                    autocomplete="new-password"
                    required
                >


                <button
                    class="auth-button"
                    type="submit"
                >
                    Change Password
                </button>

            </form>


            <div
                id="auth-message"
                class="auth-message"
            ></div>


            <div class="auth-links">

                <a href="login.html">
                    Back to Login
                </a>

            </div>

        </section>

    </main>


    <!-- Supabase library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Authentication code -->
    <script src="scripts/auth.js"></script>


</body>

</html>
