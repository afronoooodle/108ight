<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>108ight — Login</title>

    <link
        rel="stylesheet"
        href="../styles/auth.css"
    >

</head>


<body data-auth-page="login">


    <main class="auth-page">

        <section class="auth-box">

            <h1 class="auth-title">
                Login
            </h1>


            <form
                id="login-form"
                class="auth-form"
            >

                <label for="email">
                    Email
                </label>

                <input
                    id="email"
                    type="email"
                    autocomplete="username"
                    required
                >


                <label for="password">
                    Password
                </label>

                <input
                    id="password"
                    type="password"
                    autocomplete="current-password"
                    required
                >


                <button
                    class="auth-button"
                    type="submit"
                >
                    Login
                </button>

            </form>


            <div
                id="auth-message"
                class="auth-message"
            ></div>


            <div class="auth-links">

                <a href="forgot-password.html">
                    Forgot your password?
                </a>

                <a href="signup.html">
                    Create an account
                </a>

                <a href="index.html">
                    Back to 108ight
                </a>

            </div>

        </section>

    </main>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="scripts/auth.js"></script>


</body>

</html>
