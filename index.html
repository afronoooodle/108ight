<script>
    // =====================================================
    // 108IGHT ROUTING
    // =====================================================

    const APP_BASE_PATH = "/108ight";

    window.__108IGHT_BASE_PATH = APP_BASE_PATH;

    const validRoutes = [
        "/",
        "/gallery",
        "/login",
        "/signup",
        "/forgot-password",
        "/reset-password",
        "/account"
    ];

    function normalise108ightRoute(path) {

        if (path.startsWith(APP_BASE_PATH)) {
            path = path.substring(APP_BASE_PATH.length) || "/";
        }

        path = path.replace(/\/+$/, "") || "/";

        return validRoutes.includes(path) ? path : "/";
    }

    const params = new URLSearchParams(
        window.location.search
    );

    const requestedPath = params.get("p");

    let initialRoute;

    if (requestedPath) {

        initialRoute = normalise108ightRoute(requestedPath);

        history.replaceState(
            {},
            "",
            APP_BASE_PATH +
            (initialRoute === "/" ? "/" : initialRoute) +
            window.location.hash
        );

    } else {

        initialRoute = normalise108ightRoute(
            window.location.pathname
        );

    }

    window.__108IGHT_INITIAL_ROUTE = initialRoute;

    window.__108IGHT_INITIAL_PAGE =
        initialRoute === "/gallery"
            ? "gallery"
            : "home";
</script>


</head>


<body data-page="home">

    <script>
    document.body.dataset.page =
        window.__108IGHT_INITIAL_PAGE;

    const returningFromGallery =
        new URLSearchParams(window.location.search)
            .get("returning") === "gallery";

    if (returningFromGallery) {

        document.body.classList.add("gallery-returning");

        window.history.replaceState(
            {},
            "",
            window.location.pathname + window.location.hash
        );

        setTimeout(() => {
            document.body.classList.remove("gallery-returning");
        }, 950);

    }
</script>
