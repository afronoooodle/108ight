<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>108ight — Reset Password</title>

    <link
        rel="stylesheet"
        href="auth.css"
    >

</head>


<body>


    <main class="auth-page">

        <section class="auth-box">

            <h1 class="auth-title">
                Reset Password
            </h1>


            <p>
                Enter the email address connected to your account.
            </p>


            <form
                id="forgot-password-form"
                class="auth-form"
            >

                <label for="email">
                    Email
                </label>

                <input
                    id="email"
                    type="email"
                    autocomplete="email"
                    required
                >


                <button
                    class="auth-button"
                    type="submit"
                >
                    Send Reset Email
                </button>

            </form>


            <div
                id="auth-message"
                class="auth-message"
            ></div>


            <div class="auth-links">

                <a href="login.html">
                    Back to Login
                </a>

                <a href="index.html">
                    Back to 108ight
                </a>

            </div>

        </section>

    </main>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="scripts/auth.js"></script>


</body>

</html>
